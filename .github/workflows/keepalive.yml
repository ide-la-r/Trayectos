# Mantener el contenedor despierto en horario razonable.
#
# El plan gratuito de Render duerme el servicio a los 15 minutos sin trafico y
# tarda cerca de un minuto en despertar. Un ping continuo lo evitaria, pero el
# plan da 750 horas de instancia al mes y estar despierto las 24 horas consume
# unas 730: cabe, pero sin margen, y el castigo por agotarlas es que Render
# suspende todos los servicios gratuitos hasta el mes siguiente.
#
# Asi que se mantiene despierto solo en la franja en la que alguien va a abrirlo:
# de 06:00 a 21:00 UTC son unas 450 horas al mes, holgado bajo el limite, y fuera
# de esa franja duerme y no gasta nada.
#
# NO FUNCIONA, y esto esta medido, no supuesto (09-09-2026). El cron dice cada
# 10 minutos; GitHub lo ejecuta cada 2 o 4 HORAS. Ejecuciones reales del dia 8:
# 10:31, 14:45, 18:07 y 21:06 UTC. Ademas lanza trabajos fuera de la ventana
# (22:48, 22:25) porque los arrastra con una o dos horas de retraso.
#
# La causa es que la programacion de GitHub Actions es "best effort" y los
# horarios de mucha frecuencia en repositorios publicos se descartan sin aviso.
# Render duerme a los 15 minutos, asi que un ping cada 2-4 horas no mantiene
# nada despierto: solo evita el arranque en frio a quien entre justo despues.
#
# Se deja porque no cuesta nada y esos pocos despertares no sobran, pero para
# que el servicio este despierto de verdad hace falta un servicio de
# monitorizacion externo (cron-job.org, UptimeRobot y similares) apuntando a
# /up cada 5 minutos. Ojo con las 750 horas/mes del plan gratuito: 24 horas al
# dia son unas 730 y no dejan margen, asi que conviene limitar el horario.

name: Mantener despierto

on:
    schedule:
        # Cada 10 minutos entre las 06:00 y las 20:50 UTC
        - cron: '*/10 6-20 * * *'
    workflow_dispatch:

# Si una ejecucion se solapa con la anterior, no tiene sentido acumularlas
concurrency:
    group: keepalive
    cancel-in-progress: true

jobs:
    ping:
        runs-on: ubuntu-latest

        steps:
            - name: Despertar el servicio
              run: |
                  for intento in 1 2 3; do
                    if curl -fsS --max-time 60 "${{ secrets.APP_URL }}/up" > /dev/null; then
                      echo "Despierto en el intento $intento"
                      exit 0
                    fi
                    echo "Todavia arrancando... (intento $intento)"
                    sleep 20
                  done
                  echo "No ha respondido a tiempo"
                  exit 1
