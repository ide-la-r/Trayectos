; OPcache para producción. En el plan gratuito la CPU es el recurso escaso:
; sin esto, cada petición vuelve a compilar todo el framework.
opcache.enable=1
opcache.memory_consumption=96
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; El contenedor duerme y despierta: menos memoria por petición es más margen
memory_limit=192M
